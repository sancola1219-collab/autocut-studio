<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>口說剪片台</title>
<style>
  :root{
    --bg:#0b0e14; --bg2:#121722; --card:#161c28; --line:#232b3a;
    --ink:#e8edf6; --sub:#8b97ad; --accent:#7c5cff; --accent2:#22d3ee;
    --cut:#ff5d73; --speed:#ffb454; --mute:#9aa4b8; --vol:#4ade80;
    --sub-c:#22d3ee; --mark:#c084fc; --unknown:#f5a524;
    --grad:linear-gradient(135deg,#7c5cff,#22d3ee);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Microsoft JhengHei","Segoe UI",system-ui,sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%,#1a2030,transparent),var(--bg);
    color:var(--ink);min-height:100vh}
  header{display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line)}
  .logo{width:38px;height:38px;border-radius:11px;background:var(--grad);
    display:grid;place-items:center;font-size:20px;box-shadow:0 6px 22px rgba(124,92,255,.4)}
  h1{font-size:18px;margin:0;letter-spacing:.5px}
  h1 small{display:block;font-size:11px;color:var(--sub);font-weight:400;letter-spacing:2px;margin-top:2px}
  .wrap{display:grid;grid-template-columns:1fr 340px;gap:18px;padding:18px 22px;max-width:1200px;margin:0 auto}
  @media(max-width:880px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .open-row{display:flex;gap:8px;margin-bottom:10px}
  /* 素材庫 */
  .lib{margin-bottom:14px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .lib-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin-bottom:6px}
  .lib-head button{padding:3px 10px;font-size:12px;border-radius:7px}
  .lib-list{display:flex;flex-direction:column;gap:3px;max-height:132px;overflow:auto}
  .lib-item{display:flex;gap:10px;align-items:baseline;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:12.5px;transition:.12s}
  .lib-item:hover{background:#7c5cff22}
  .lib-item .t{color:var(--accent2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .lib-item .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lib-item .s{color:var(--sub);font-size:11px;white-space:nowrap}
  .lib-empty{color:var(--sub);font-size:12px;padding:6px 8px}
  input[type=text]{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);padding:10px 12px;font-size:14px;font-family:inherit}
  input[type=text]:focus{outline:none;border-color:var(--accent)}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;color:#fff;
    padding:10px 16px;font-size:14px;background:var(--bg2);border:1px solid var(--line);color:var(--ink);
    transition:.15s}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--grad);border:none;font-weight:600;box-shadow:0 6px 20px rgba(124,92,255,.35)}
  button.primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  video{width:100%;border-radius:12px;background:#000;display:block;aspect-ratio:16/9;object-fit:contain}
  .empty{display:grid;place-items:center;aspect-ratio:16/9;border:2px dashed var(--line);border-radius:12px;color:var(--sub);text-align:center;padding:20px;font-size:14px}
  /* 時間軸 */
  .tl{position:relative;height:38px;margin:14px 0 4px;background:var(--bg2);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
  .tl .play{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 8px #fff;z-index:3}
  .tl .mk{position:absolute;top:0;bottom:0;opacity:.75;z-index:1}
  .tl .mk.point{width:3px}
  .times{display:flex;justify-content:space-between;color:var(--sub);font-size:11px;font-variant-numeric:tabular-nums}
  /* 按住說話 */
  .talk-zone{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:16px}
  .ptt{width:96px;height:96px;border-radius:50%;background:var(--grad);border:none;display:grid;place-items:center;
    font-size:30px;position:relative;user-select:none;transition:transform .1s;box-shadow:0 10px 30px rgba(124,92,255,.4)}
  .ptt:active{transform:scale(.95)}
  .ptt.rec{background:linear-gradient(135deg,#ff5d73,#ff2d55);animation:pulse 1s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,45,85,.6)}70%{box-shadow:0 0 0 22px rgba(255,45,85,0)}100%{box-shadow:0 0 0 0 rgba(255,45,85,0)}}
  .ptt-hint{color:var(--sub);font-size:13px;text-align:center}
  .heard{min-height:24px;text-align:center;font-size:15px;color:var(--accent2);font-weight:600}
  .type-row{display:flex;gap:8px;width:100%;margin-top:6px}
  /* 清單 */
  .side h2{font-size:14px;margin:0 0 12px;color:var(--sub);letter-spacing:1px;display:flex;justify-content:space-between}
  .oplist{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto}
  .op{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);
    border-left:4px solid var(--mute);border-radius:10px;padding:9px 11px;font-size:13px;animation:slidein .2s}
  @keyframes slidein{from{opacity:0;transform:translateX(10px)}to{opacity:1}}
  .op .tag{font-size:11px;padding:2px 7px;border-radius:6px;background:#0006;white-space:nowrap}
  .op .txt{flex:1;line-height:1.35}
  .op .txt small{color:var(--sub);display:block;font-size:11px}
  .op .del{background:none;border:none;color:var(--sub);padding:2px 6px;font-size:16px}
  .op .del:hover{color:var(--cut)}
  .op[data-t=cut]{border-left-color:var(--cut)} .op[data-t=speed]{border-left-color:var(--speed)}
  .op[data-t=mute]{border-left-color:var(--mute)} .op[data-t=volume]{border-left-color:var(--vol)}
  .op[data-t=subtitle]{border-left-color:var(--sub-c)} .op[data-t=mark_start]{border-left-color:var(--mark)}
  .op[data-t=unknown]{border-left-color:var(--unknown);background:#2a2213}
  .op .ask{background:none;border:1px solid var(--unknown);color:var(--unknown);font-size:11px;padding:3px 8px;border-radius:6px}
  .side-foot{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
  .opts{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;font-size:13px;color:var(--sub)}
  .prog{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:10px;display:none}
  .prog.on{display:block}
  .prog i{display:block;height:100%;width:30%;background:var(--grad);border-radius:99px;animation:march 1.2s infinite}
  @keyframes march{0%{margin-left:-30%}100%{margin-left:100%}}
  .status{font-size:12px;color:var(--sub);margin-top:8px;text-align:center;min-height:16px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222b;backdrop-filter:blur(8px);
    border:1px solid var(--line);color:var(--ink);padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  /* 錄旁白 */
  .narr{margin-top:18px}
  .narr>summary{cursor:pointer;font-size:14px;padding:12px 16px;background:var(--card);
    border:1px solid var(--line);border-radius:14px;list-style:none;display:flex;
    align-items:center;gap:10px;transition:.15s}
  .narr>summary::-webkit-details-marker{display:none}
  .narr>summary:hover{border-color:var(--accent)}
  .narr>summary b{font-size:18px}
  .narr>summary small{color:var(--sub);font-weight:400;margin-left:auto;font-size:12px}
  .narr[open]>summary{border-radius:14px 14px 0 0;border-bottom:none}
  .narr-body{background:var(--card);border:1px solid var(--line);border-top:none;
    border-radius:0 0 14px 14px;padding:16px}
  .tele{width:100%;min-height:190px;max-height:44vh;background:var(--bg2);
    border:1px solid var(--line);border-radius:10px;color:var(--ink);
    padding:16px 18px;font-size:17px;line-height:2.0;font-family:inherit;
    resize:vertical;white-space:pre-wrap}
  .tele:focus{outline:none;border-color:var(--accent)}
  .tele.big{font-size:22px;line-height:2.1}
  .rec-row{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
  .rec-btn{background:linear-gradient(135deg,#ff5d73,#ff2d55);border:none;color:#fff;
    padding:12px 22px;border-radius:11px;font-size:15px;font-weight:600;
    box-shadow:0 6px 20px rgba(255,45,85,.3)}
  .rec-btn.stop{background:linear-gradient(135deg,#64748b,#475569);box-shadow:none}
  .rec-time{font-variant-numeric:tabular-nums;font-size:20px;color:var(--cut);
    font-weight:700;min-width:62px;display:none}
  .rec-time.on{display:inline-block}
  .rec-hint{font-size:12px;color:var(--sub);flex:1;min-width:180px}
  .narr-list{display:flex;flex-direction:column;gap:4px;margin-top:12px}
  .narr-item{display:flex;gap:10px;align-items:center;background:var(--bg2);
    border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12.5px}
  .narr-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .narr-item .dur{color:var(--accent2);font-variant-numeric:tabular-nums}
  .narr-item .w{color:var(--sub);font-size:11px}
  .narr-item audio{height:28px;max-width:190px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--sub);margin-top:10px}
  .legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:3px;vertical-align:middle}
  a.dl{display:inline-block;margin-top:10px;color:var(--accent2);font-size:13px}
</style>
</head>
<body>
<header>
  <div class="logo">🎬</div>
  <h1>口說剪片台<small>VOICE&nbsp;·&nbsp;CUT&nbsp;·&nbsp;STUDIO</small></h1>
</header>

<div class="wrap">
  <div class="main">
    <div class="card">
      <div class="open-row">
        <input id="path" type="text" placeholder="把影片檔案路徑貼進來（或拖影片檔到這個框）…">
        <button class="primary" onclick="openVideo()">開啟</button>
      </div>
      <div class="lib">
        <div class="lib-head"><span>📂 素材庫 — 把影片丟進「素材」資料夾，點一下就開</span>
          <button onclick="loadLib()">↻ 重新整理</button></div>
        <div class="lib-list" id="libList"></div>
      </div>
      <div id="stage">
        <div class="empty" id="empty">還沒開啟影片～<br>把檔案路徑貼上面按「開啟」，或直接把影片拖進來</div>
        <video id="vid" controls style="display:none"></video>
      </div>

      <div class="tl" id="tl">
        <div class="play" id="play" style="left:0"></div>
      </div>
      <div class="times"><span id="cur">00:00</span><span id="dur">00:00</span></div>

      <div class="talk-zone">
        <button class="ptt" id="ptt" title="按住說話（或按住空白鍵）">🎙️</button>
        <div class="ptt-hint">按住這顆鈕（或按住 <b>空白鍵</b>）講出你的需求，放開就辨識<br>
          例如：「這裡加字幕買一送一」「從這裡開始」→「剪到這裡」「這段加快兩倍」</div>
        <div class="heard" id="heard"></div>
        <div class="type-row">
          <input id="typed" type="text" placeholder="也可以打字下命令，Enter 送出（用目前播放位置）">
          <button onclick="sendTyped()">送出</button>
        </div>
      </div>
    </div>
    <details class="narr" id="narrBox">
      <summary><b>🎤</b> 錄旁白（用自己的聲音配音）
        <small id="narrSum">點開展開提字機</small></summary>
      <div class="narr-body">
        <textarea class="tele" id="tele" spellcheck="false"
          placeholder="把念稿貼進來，或按下面「載入念稿」自動抓「素材」裡最新的 .txt…"></textarea>
        <div class="rec-row">
          <button onclick="loadScript()">📄 載入念稿</button>
          <button onclick="document.getElementById('tele').classList.toggle('big')">🔍 放大字</button>
          <label style="font-size:12.5px;color:var(--sub)">存成
            <input id="narrName" type="text" value="我的旁白" style="width:120px;padding:6px 8px;font-size:12.5px">
          </label>
        </div>
        <div class="rec-row">
          <button class="rec-btn" id="recBtn" onclick="toggleNarr()">● 開始錄音</button>
          <span class="rec-time" id="recTime">0:00</span>
          <span class="rec-hint" id="recHint">按下去就開始念，念完再按一次停止。念錯不用重來，停一下重念那句就好。</span>
        </div>
        <div class="narr-list" id="narrList"></div>
      </div>
    </details>

    <div class="legend">
      <span><b style="background:var(--cut)"></b>剪掉</span>
      <span><b style="background:var(--speed)"></b>變速</span>
      <span><b style="background:var(--mute)"></b>靜音</span>
      <span><b style="background:var(--vol)"></b>音量</span>
      <span><b style="background:var(--sub-c)"></b>字幕</span>
      <span><b style="background:var(--mark)"></b>起點</span>
      <span><b style="background:var(--unknown)"></b>待解讀</span>
    </div>
  </div>

  <div class="card side">
    <h2><span>操作清單</span><span id="count">0</span></h2>
    <div class="oplist" id="oplist"></div>
    <div class="side-foot">
      <div class="opts">
        <label><input type="checkbox" id="optSubs" checked> 燒錄字幕到畫面</label>
      </div>
      <button class="primary" id="renderBtn" style="width:100%" onclick="render()" disabled>🎞️ 開始算圖</button>
      <div class="prog" id="prog"><i></i></div>
      <div class="status" id="status"></div>
      <div id="result"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const vid = $("#vid"), tl = $("#tl");
let ops = [];            // 操作清單
let pendingStart = null; // 「從這裡開始」暫存
let duration = 0;
let mediaRec = null, chunks = [], recording = false;

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2200);}
function fmt(s){s=Math.max(0,s|0);return String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}

// ---- 開啟影片 ----
async function openVideo(){
  const path = $("#path").value.trim();
  if(!path){toast("先貼上影片路徑");return;}
  const r = await fetch("/open",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({path})});
  const d = await r.json();
  if(d.error){toast(d.error);return;}
  // 換片先清掉舊影片的操作，不然舊清單會套到新影片上
  ops = []; pendingStart = null;
  duration = d.duration;
  renderList(); drawMarkers();
  $("#result").innerHTML=""; $("#heard").textContent=""; $("#status").textContent="";
  $("#empty").style.display="none";
  vid.style.display="block";
  vid.src = "/video?t="+Date.now();
  vid.load();
  $("#dur").textContent = fmt(duration);
  $("#renderBtn").disabled = false;
  toast("開好了：" + d.name);
}
// 拖檔進來自動填路徑
["dragover","drop"].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
document.addEventListener("drop",e=>{
  const f=e.dataTransfer.files[0];
  if(f && f.path){$("#path").value=f.path; openVideo();}
  else if(f){toast("瀏覽器拿不到完整路徑，請手動貼上路徑");}
});

vid.addEventListener("timeupdate",()=>{
  $("#cur").textContent=fmt(vid.currentTime);
  if(duration) $("#play").style.left=(vid.currentTime/duration*100)+"%";
});
tl.addEventListener("click",e=>{
  if(!duration)return;
  const r=tl.getBoundingClientRect();
  vid.currentTime=(e.clientX-r.left)/r.width*duration;
});

// ---- 錄音（按住說話）----
async function initMic(){
  if(mediaRec) return true;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRec = new MediaRecorder(stream);
    mediaRec.ondataavailable = e => chunks.push(e.data);
    mediaRec.onstop = sendClip;
    return true;
  }catch(err){toast("拿不到麥克風權限："+err.message);return false;}
}
let micPending=false;
async function startRec(){
  if(recording || micPending) return;
  if(!duration){toast("先開啟影片");return;}
  micPending=true;                  // await 前先佔位，代表這次手勢還在準備麥克風
  const ok=await initMic();
  if(!micPending) return;           // 準備期間就放開了 → 取消，不要開始錄
  micPending=false;
  if(!ok) return;
  chunks=[]; recording=true;
  $("#ptt").classList.add("rec"); $("#heard").textContent="聆聽中…";
  mediaRec.start();
}
function stopRec(){
  if(micPending){micPending=false;return;}   // 還在等麥克風就放開 → 取消
  if(!recording) return;
  recording=false; $("#ptt").classList.remove("rec");
  $("#heard").textContent="辨識中…";
  mediaRec.stop();
}
async function sendClip(){
  const blob = new Blob(chunks,{type:"audio/webm"});
  const at = vid.currentTime;
  const url = "/transcribe?at="+at+(pendingStart!=null?"&pending_start="+pendingStart:"");
  try{
    const r = await fetch(url,{method:"POST",headers:{"Content-Type":"audio/webm"},body:blob});
    const d = await r.json();
    if(d.error){$("#heard").textContent="";toast(d.error);return;}
    $("#heard").textContent = d.text ? ("聽到：「"+d.text+"」") : "沒聽清楚";
    if(d.op) addOp(d.op,d.desc);
  }catch(e){$("#heard").textContent="";toast("辨識連線失敗");}
}
// 按鈕與空白鍵
const ptt=$("#ptt");
ptt.addEventListener("mousedown",startRec);
ptt.addEventListener("touchstart",e=>{e.preventDefault();startRec();});
document.addEventListener("mouseup",stopRec);
document.addEventListener("touchend",stopRec);
document.addEventListener("keydown",e=>{
  const t=e.target;
  // 焦點在輸入框／按鈕／勾選框時，保留空白鍵原本的功能
  if(e.code==="Space" && !/^(INPUT|TEXTAREA|BUTTON|SELECT)$/.test(t.tagName)
     && !t.isContentEditable){e.preventDefault();startRec();}
});
document.addEventListener("keyup",e=>{if(e.code==="Space")stopRec();});

// ---- 打字下命令 ----
async function sendTyped(){
  const text=$("#typed").value.trim();
  if(!text){return;}
  if(!duration){toast("先開啟影片");return;}
  const r=await fetch("/parse",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({text,at:vid.currentTime,pending_start:pendingStart})});
  const d=await r.json();
  $("#typed").value="";
  $("#heard").textContent="輸入：「"+text+"」";
  if(d.op) addOp(d.op,d.desc);
}
$("#typed").addEventListener("keydown",e=>{if(e.key==="Enter")sendTyped();});

// ---- 操作清單 ----
function addOp(op,desc){
  if(op.type==="mark_start"){ pendingStart=op.start; toast("已標記起點，再講『剪到這裡』"); }
  else if(["cut","speed","mute","volume"].includes(op.type)){ pendingStart=null; }
  op._desc=desc; ops.push(op); renderList(); drawMarkers();
}
function delOp(i){
  ops.splice(i,1);
  // 依 addOp 的規則重算尚未被用掉的起點，免得留下已刪除的幽靈起點
  pendingStart=null;
  for(const o of ops){
    if(o.type==="mark_start") pendingStart=o.start;
    else if(["cut","speed","mute","volume"].includes(o.type)) pendingStart=null;
  }
  renderList(); drawMarkers();
}
function askClaude(i){
  const o=ops[i];
  const line=`（口說剪片）影片在 ${fmt(o.at)} 時我說：「${o.raw}」，請幫我轉成具體剪輯操作。`;
  navigator.clipboard.writeText(line).then(()=>toast("已複製，貼到 Claude 對話框即可"));
}
function renderList(){
  const box=$("#oplist"); box.innerHTML="";
  $("#count").textContent=ops.length;
  ops.forEach((o,i)=>{
    const el=document.createElement("div");
    el.className="op"; el.dataset.t=o.type;
    const label={cut:"剪掉",speed:"變速",mute:"靜音",volume:"音量",subtitle:"字幕",mark_start:"起點",unknown:"待解讀"}[o.type]||o.type;
    el.innerHTML=`<span class="tag">${label}</span>
      <div class="txt">${o._desc}<small>${o.raw||""}</small></div>
      ${o.type==="unknown"?`<button class="ask" onclick="askClaude(${i})">複製給 Claude</button>`:""}
      <button class="del" onclick="delOp(${i})" title="刪除">×</button>`;
    box.appendChild(el);
  });
}
function drawMarkers(){
  tl.querySelectorAll(".mk").forEach(e=>e.remove());
  if(!duration)return;
  const color={cut:"var(--cut)",speed:"var(--speed)",mute:"var(--mute)",volume:"var(--vol)",subtitle:"var(--sub-c)",mark_start:"var(--mark)"};
  ops.forEach(o=>{
    if(o.start==null)return;
    const m=document.createElement("div"); m.className="mk";
    m.style.background=color[o.type]||"var(--unknown)";
    m.style.left=(o.start/duration*100)+"%";
    if(o.end!=null && o.type!=="subtitle" && o.type!=="mark_start"){
      m.style.width=Math.max(1,(o.end-o.start)/duration*100)+"%";
    }else{ m.classList.add("point"); }
    tl.appendChild(m);
  });
}

// ---- 算圖 ----
async function render(){
  if(!ops.filter(o=>o.type!=="unknown"&&o.type!=="mark_start").length){toast("清單裡沒有可套用的操作");return;}
  const btn=$("#renderBtn");
  if(btn.disabled) return;          // 已經在算了，忽略連點
  btn.disabled=true;                // 先擋住再送，避免同時開兩條算圖
  try{
    const r=await fetch("/render",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ops, options:{subs:$("#optSubs").checked}})});
    const d=await r.json();
    if(d.error){toast(d.error); btn.disabled=false; return;}
    $("#prog").classList.add("on"); $("#result").innerHTML="";
    poll();
  }catch(e){ toast("算圖連線失敗"); btn.disabled=false; }
}
async function poll(){
  const r=await fetch("/render_status"); const d=await r.json();
  $("#status").textContent=d.progress||"";
  if(d.running){setTimeout(poll,700);return;}
  $("#prog").classList.remove("on"); $("#renderBtn").disabled=false;
  if(d.error){toast("算圖失敗："+d.error);$("#status").textContent="失敗："+d.error;return;}
  if(d.output){
    $("#status").textContent="完成！";
    $("#result").innerHTML=`<video src="/output?t=${Date.now()}" controls style="width:100%;border-radius:10px;margin-top:10px"></video>
      <a class="dl" href="/output?t=${Date.now()}" download>⬇ 下載成品</a>`;
    toast("剪好了～");
  }
}

// ---- 錄旁白（提字機）----
let narrRec=null, narrChunks=[], narrOn=false, narrT0=0, narrTimer=null;

async function loadScript(){
  try{
    const d=await (await fetch("/script")).json();
    if(!d.text){toast("「素材」裡找不到 .txt 念稿");return;}
    $("#tele").value=d.text;
    toast("已載入："+d.name);
  }catch(e){toast("載入失敗");}
}

let narrPending=false;
async function toggleNarr(){
  if(narrOn){ stopNarr(); return; }
  if(narrPending) return;              // 權限視窗還開著，連點不要開第二個錄音器
  narrPending=true;
  $("#recBtn").disabled=true;
  $("#recHint").textContent="正在取得麥克風權限…";
  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false, noiseSuppression:true, autoGainControl:false}});
  }catch(err){
    narrPending=false; $("#recBtn").disabled=false;
    $("#recHint").textContent="拿不到麥克風權限。";
    toast("拿不到麥克風："+err.message); return;
  }
  narrPending=false; $("#recBtn").disabled=false;
  narrChunks=[];
  try{
    narrRec=new MediaRecorder(stream);
  }catch(err){
    stream.getTracks().forEach(t=>t.stop());
    $("#recHint").textContent="這個瀏覽器不支援錄音。";
    toast("建立錄音器失敗："+err.message); return;
  }
  narrRec.ondataavailable=e=>{ if(e.data.size) narrChunks.push(e.data); };
  narrRec.onstop=async ()=>{
    stream.getTracks().forEach(t=>t.stop());
    // 用錄音器實際產生的格式（Chrome 是 webm，Safari 是 mp4）
    const mt=(narrRec.mimeType||"audio/webm").split(";")[0];
    const blob=new Blob(narrChunks,{type:mt});
    if(!blob.size){ $("#recHint").textContent="沒錄到聲音（檢查麥克風）"; return; }
    $("#recHint").textContent="存檔中…";
    const nm=encodeURIComponent($("#narrName").value.trim()||"我的旁白");
    // 存檔失敗時給下載連結，念很久的錄音絕對不能就這樣消失
    const rescue=()=>{
      const url=URL.createObjectURL(blob);
      $("#recHint").innerHTML=`存檔失敗，<a href="${url}" download="旁白備份.${
        mt.includes("mp4")?"m4a":"webm"}" style="color:var(--accent2)">點這裡下載備份</a>`
        +`，再手動放進「素材/我的聲音」。`;
    };
    try{
      const r=await fetch("/save_narration?name="+nm,
        {method:"POST",headers:{"Content-Type":mt},body:blob});
      const d=await r.json();
      if(d.error){toast(d.error); rescue(); return;}
      $("#recHint").textContent=`已存成 ${d.name}（${d.duration} 秒）`;
      $("#narrSum").textContent=`最新：${d.name} · ${d.duration}秒`;
      toast(`旁白存好了：${d.name}（${d.duration} 秒）`);
      loadNarrs();
    }catch(e){toast("存檔連線失敗"); rescue();}
  };
  narrRec.start();
  narrOn=true; narrT0=Date.now();
  $("#recBtn").textContent="■ 停止錄音"; $("#recBtn").classList.add("stop");
  $("#recTime").classList.add("on");
  $("#recHint").textContent="錄音中…照著上面念，念完按停止。";
  narrTimer=setInterval(()=>{
    const s=Math.floor((Date.now()-narrT0)/1000);
    $("#recTime").textContent=`${s/60|0}:${String(s%60).padStart(2,"0")}`;
  },250);
}
function stopNarr(){
  if(!narrOn) return;
  narrOn=false; clearInterval(narrTimer);
  $("#recBtn").textContent="● 開始錄音"; $("#recBtn").classList.remove("stop");
  $("#recTime").classList.remove("on");
  narrRec.stop();
}

async function loadNarrs(){
  const box=$("#narrList"); if(!box) return;
  box.innerHTML="";
  try{
    const d=await (await fetch("/narrations")).json();
    d.items.forEach(it=>{
      const el=document.createElement("div"); el.className="narr-item";
      const nm=document.createElement("span"); nm.className="nm"; nm.textContent=it.name;
      const du=document.createElement("span"); du.className="dur"; du.textContent=it.duration+"s";
      const wh=document.createElement("span"); wh.className="w"; wh.textContent=it.when;
      const au=document.createElement("audio"); au.controls=true; au.preload="none";
      au.src="/narr_audio?name="+encodeURIComponent(it.name);
      el.append(nm,du,wh,au); box.appendChild(el);
    });
  }catch(e){}
}

// ---- 素材庫 ----
async function loadLib(){
  const box=$("#libList"); box.innerHTML="";
  try{
    const d=await (await fetch("/library")).json();
    if(!d.videos.length){
      const e=document.createElement("div"); e.className="lib-empty";
      e.textContent="還沒有素材～把影片丟進「素材」資料夾，再按 ↻";
      box.appendChild(e); return;
    }
    d.videos.forEach(v=>{
      const el=document.createElement("div"); el.className="lib-item";
      el.title=v.path;
      const t=document.createElement("span"); t.className="t"; t.textContent=v.mtime;
      const n=document.createElement("span"); n.className="n"; n.textContent=v.name;
      const s=document.createElement("span"); s.className="s"; s.textContent=v.size;
      el.append(t,n,s);
      el.onclick=()=>{$("#path").value=v.path; openVideo();};
      box.appendChild(el);
    });
  }catch(e){/* 伺服器沒起來就算了 */}
}
loadLib();
loadNarrs();

// 初始：把已開啟的影片接回來
fetch("/state").then(r=>r.json()).then(d=>{
  if(d.video){$("#path").value=d.video; openVideo();}
});
</script>
